name: WAZ login BDD

# Runs the login suite against a full local stack: backend (port 8080) and the
# Vite frontend (port 5173). The suite itself is in this repository; the app
# repositories are checked out next to it.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 1 * * *"          # nightly: regression including @slow
  workflow_dispatch:
    inputs:
      run_destructive:
        description: "Also run @destructive lockout scenarios (locks the test account briefly)"
        type: boolean
        default: false

concurrency:
  group: login-bdd-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: http://localhost:5173
  API_HEALTH_URL: http://localhost:8080/actuator/health
  MOBILE_FAMILY_HEAD: "9000000002"
  MOBILE_FAMILY_MEMBER: "9000000001"
  MOBILE_UNREGISTERED: "9307835654"
  OTP_TEST: "123456"
  HEADLESS: "true"

jobs:
  login-suite:
    name: Login BDD (${{ github.event_name == 'schedule' && 'nightly regression' || 'PR smoke' }})
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check out test suite
        uses: actions/checkout@v4
        with:
          path: tests

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKEND_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app/backend

      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FRONTEND_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app/frontend

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            tests/pom.xml
            app/backend/pom.xml

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install and start frontend (Vite dev server)
        working-directory: app/frontend
        env:
          # Firebase web config for the test project. Non-secret web keys still live in secrets to keep them out of logs.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Start backend
        working-directory: app/backend
        env:
          # Firebase Admin credentials (JSON) for the test project, kept in secrets.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          AUTH_SESSION_TTL_SEC: "43200"
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # BACKEND_START_CMD is a repository variable, e.g. "./mvnw -q spring-boot:run"
          nohup bash -c "${{ vars.BACKEND_START_CMD || './mvnw -q spring-boot:run' }}" > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for services
        run: |
          curl --retry 60 --retry-delay 3 --retry-connrefused -fsS "$APP_URL" > /dev/null
          curl --retry 90 --retry-delay 3 --retry-connrefused -fsS "$API_HEALTH_URL" > /dev/null
          echo "frontend and backend are up"

      - name: Run smoke scenarios (PR) or full regression (nightly)
        working-directory: tests
        env:
          TAG_EXPR: ${{ github.event_name == 'schedule' && 'not @known-defect and not @manual and not @destructive and not @needs-test-data and not @needs-clarification and not @pending-feature and not @requires-environment-control' || '@smoke and not @known-defect and not @manual and not @slow and not @destructive and not @needs-test-data and not @needs-clarification and not @pending-feature and not @requires-environment-control' }}
        run: mvn -B test -Dcucumber.filter.tags="$TAG_EXPR"

      - name: Run destructive lockout scenarios (after the main run)
        if: always() && (github.event_name == 'schedule' || inputs.run_destructive == true)
        working-directory: tests
        run: mvn -B test -Dcucumber.filter.tags="@destructive and not @known-defect and not @manual and not @needs-test-data"

      - name: Known defects (report only, does not fail the build)
        if: always()
        working-directory: tests
        continue-on-error: true
        run: |
          # Keep the main run's report; the known-defect run writes to target/cucumber again.
          mv target/cucumber target/cucumber-main 2>/dev/null || true
          mvn -B test -Dcucumber.filter.tags="@known-defect and not @manual and not @needs-test-data"

      - name: Upload Cucumber reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-bdd-reports-${{ github.run_id }}
          path: |
            tests/target/cucumber-main/
            tests/target/cucumber/
            tests/target/surefire-reports/
          retention-days: 14

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/*.log
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          pkill -f "vite" || true
          pkill -f "spring-boot" || true
