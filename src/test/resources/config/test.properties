# Defaults for local runs. Any key can be overridden with -Dkey=value or an
# environment variable (dots become underscores, e.g. APP_URL, MOBILE_FAMILY_HEAD).
# No secrets belong in this file.
app.url=http://localhost:5173
mobile.family-head=9000000002
mobile.family-member=9000000001
mobile.unregistered=9307835654
otp.test=123456
headless=true
explicit.wait.seconds=15
# Sending a code is a round trip to Firebase, which is slower and less steady than the app.
otp.send.wait.seconds=45
# true when app.url is HTTPS (cookie Secure flag is then asserted, TC-105)
secure.origin=false
