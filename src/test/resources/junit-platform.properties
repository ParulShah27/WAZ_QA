cucumber.publish.quiet=true
# Login scenarios share test accounts and the backend OTP rate limiter,
# so run them one at a time.
cucumber.execution.parallel.enabled=false
# Default run excludes everything that needs special data, environment
# control, long waits, or is a known defect. CI passes its own expression.
cucumber.filter.tags=not @known-defect and not @manual and not @slow and not @destructive and not @needs-test-data and not @needs-clarification and not @pending-feature and not @requires-environment-control
